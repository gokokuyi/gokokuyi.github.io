<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <!-- Background -->
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">オンボーディングページの典型的な構成</text>

  <!-- Browser frame (outer) -->
  <rect x="80" y="45" width="600" height="340" rx="8" fill="#f7f6f4" stroke="#d8d3cc" stroke-width="1.5"/>

  <!-- Browser title bar -->
  <rect x="80" y="45" width="600" height="28" rx="8" fill="#e0ddd8"/>
  <rect x="80" y="59" width="600" height="14" fill="#e0ddd8"/>
  <!-- Browser dots -->
  <circle cx="102" cy="59" r="5" fill="#e07b39"/>
  <circle cx="120" cy="59" r="5" fill="#d8d3cc"/>
  <circle cx="138" cy="59" r="5" fill="#d8d3cc"/>
  <!-- URL bar -->
  <rect x="160" y="51" width="400" height="16" rx="4" fill="#ffffff" stroke="#d8d3cc" stroke-width="1"/>
  <text x="360" y="63" text-anchor="middle" font-size="9" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">https://intranet.example.com/onboarding</text>

  <!-- Section 1: Welcome -->
  <rect x="95" y="83" width="570" height="44" rx="4" fill="#1a3a5c"/>
  <text x="380" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">ようこそ！〇〇チームへ</text>
  <text x="380" y="117" text-anchor="middle" font-size="11" fill="#b8c8d8" font-family="Hiragino Sans, Meiryo, sans-serif">このチームのミッションと雰囲気</text>

  <!-- Section 2: Checklist -->
  <rect x="95" y="133" width="570" height="66" rx="4" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1"/>
  <text x="120" y="150" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">まず最初にやること（チェックリスト）</text>
  <text x="130" y="167" text-anchor="start" font-size="11" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">□ Teamsチャンネルに参加</text>
  <text x="310" y="167" text-anchor="start" font-size="11" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">□ 共有ドライブへのアクセス申請</text>
  <text x="130" y="184" text-anchor="start" font-size="11" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">□ 各種システムのアカウント取得</text>

  <!-- Section 3: Tools -->
  <rect x="95" y="205" width="570" height="44" rx="4" fill="#f7f6f4" stroke="#d8d3cc" stroke-width="1"/>
  <text x="120" y="222" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">よく使うツール・システム一覧</text>
  <text x="120" y="239" text-anchor="start" font-size="11" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">（リンク付き）</text>

  <!-- Section 4: Rules -->
  <rect x="95" y="255" width="570" height="44" rx="4" fill="#f7f6f4" stroke="#d8d3cc" stroke-width="1"/>
  <text x="120" y="272" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">チームのルール・慣習</text>
  <text x="120" y="289" text-anchor="start" font-size="11" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">会議のルール・連絡方法・休暇申請等</text>

  <!-- Section 5: FAQ -->
  <rect x="95" y="305" width="570" height="44" rx="4" fill="#fdf0e8" stroke="#e07b39" stroke-width="1"/>
  <text x="120" y="322" text-anchor="start" font-size="12" font-weight="bold" fill="#e07b39" font-family="Hiragino Sans, Meiryo, sans-serif">よくある質問（FAQ）</text>
  <text x="120" y="339" text-anchor="start" font-size="11" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">アコーディオン形式でQ&amp;Aを展開</text>

  <!-- Right-side labels -->
  <text x="692" y="109" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">① ヒーロー</text>
  <text x="692" y="160" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">② チェック</text>
  <text x="692" y="174" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">リスト</text>
  <text x="692" y="220" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">③ ツール</text>
  <text x="692" y="234" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">一覧</text>
  <text x="692" y="278" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">④ ルール</text>
  <text x="692" y="328" text-anchor="start" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">⑤ FAQ</text>

  <!-- Caption -->
  <text x="380" y="408" text-anchor="middle" font-size="11" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">図7-1　HTMLオンボーディングページの典型的なセクション構成</text>
</svg>
