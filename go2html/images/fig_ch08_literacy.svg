<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <defs>
    <marker id="arrowUp" markerWidth="8" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="4 0, 8 7, 0 7" fill="#1a3a5c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">HTMLリテラシーの五段階</text>

  <!-- Upward progress arrow on left -->
  <line x1="42" y1="295" x2="42" y2="48" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="42" y="318" text-anchor="middle" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif" transform="rotate(-90, 42, 318)">習熟度</text>

  <!-- Level 5 (top) -->
  <rect x="60" y="46" width="660" height="42" rx="5" fill="#1a3a5c"/>
  <text x="90" y="63" text-anchor="start" font-size="13" font-weight="bold" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">レベル 5</text>
  <text x="178" y="63" text-anchor="start" font-size="12" fill="#b8c8d8" font-family="Hiragino Sans, Meiryo, sans-serif">書ける（応用）</text>
  <text x="370" y="63" text-anchor="start" font-size="12" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">JavaScriptも含めてゼロから作成・設計できる</text>
  <text x="680" y="73" text-anchor="middle" font-size="10" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">エンジニア</text>
  <text x="90" y="80" text-anchor="start" font-size="10" fill="#b8c8d8" font-family="Hiragino Sans, Meiryo, sans-serif">← 本書で目指すレベルではない</text>

  <!-- Level 4 -->
  <rect x="60" y="96" width="660" height="42" rx="5" fill="#2a5a8c" stroke="#1a3a5c" stroke-width="1"/>
  <text x="90" y="113" text-anchor="start" font-size="13" font-weight="bold" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">レベル 4</text>
  <text x="178" y="113" text-anchor="start" font-size="12" fill="#b8c8d8" font-family="Hiragino Sans, Meiryo, sans-serif">書ける（基礎）</text>
  <text x="370" y="113" text-anchor="start" font-size="12" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">既存のHTMLを参考に、簡単な追加・修正ができる</text>

  <!-- Level 3 (highlighted - target) -->
  <rect x="60" y="146" width="660" height="52" rx="5" fill="#e07b39"/>
  <text x="90" y="165" text-anchor="start" font-size="13" font-weight="bold" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">レベル 3</text>
  <text x="178" y="165" text-anchor="start" font-size="12" fill="#fff3e8" font-family="Hiragino Sans, Meiryo, sans-serif">読んでわかる</text>
  <text x="370" y="162" text-anchor="start" font-size="12" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">タグと表示の対応が理解できる。</text>
  <text x="370" y="179" text-anchor="start" font-size="12" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">生成AIへの修正依頼を的確に出せる</text>
  <rect x="620" y="152" width="94" height="22" rx="11" fill="#ffffff"/>
  <text x="667" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#e07b39" font-family="Hiragino Sans, Meiryo, sans-serif">★ 目標ライン</text>

  <!-- Level 2 -->
  <rect x="60" y="206" width="660" height="42" rx="5" fill="#f7f6f4" stroke="#d8d3cc" stroke-width="1.5"/>
  <text x="90" y="223" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">レベル 2</text>
  <text x="178" y="223" text-anchor="start" font-size="12" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">大まかに読める</text>
  <text x="370" y="223" text-anchor="start" font-size="12" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">「ここが見出し、ここが本文らしい」と類推できる</text>

  <!-- Level 1 (bottom) -->
  <rect x="60" y="256" width="660" height="42" rx="5" fill="#f0eeeb" stroke="#d8d3cc" stroke-width="1"/>
  <text x="90" y="273" text-anchor="start" font-size="13" font-weight="bold" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">レベル 1</text>
  <text x="178" y="273" text-anchor="start" font-size="12" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">まったく読めない</text>
  <text x="370" y="273" text-anchor="start" font-size="12" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">HTMLを見ると「記号の羅列」にしか見えない</text>

  <!-- Horizontal line showing goal level -->
  <line x1="60" y1="146" x2="720" y2="146" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Bottom note -->
  <text x="380" y="325" text-anchor="middle" font-size="12" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">ビジネスパーソンの目標はレベル3。コードを書けなくても「読んでわかる」で十分。</text>

  <!-- Caption -->
  <text x="380" y="348" text-anchor="middle" font-size="11" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">図8-1　ビジネスパーソンに求められるHTMLリテラシーの五段階</text>
</svg>
