<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a3a5c"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e07b39"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="340" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">ワークフローの比較</text>

  <!-- Left column header: Traditional flow -->
  <rect x="20" y="50" width="340" height="36" rx="4" fill="#1a3a5c"/>
  <text x="190" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">従来のフロー</text>

  <!-- Right column header: AI + HTML flow -->
  <rect x="400" y="50" width="340" height="36" rx="4" fill="#e07b39"/>
  <text x="570" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" font-family="Hiragino Sans, Meiryo, sans-serif">生成AI + HTML のフロー</text>

  <!-- Left column steps -->
  <!-- Step 1 left -->
  <rect x="40" y="105" width="300" height="38" rx="5" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="190" y="128" text-anchor="middle" font-size="13" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">内容をOfficeで作成</text>
  <!-- Arrow left -->
  <line x1="190" y1="143" x2="190" y2="158" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 left -->
  <rect x="40" y="158" width="300" height="38" rx="5" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="190" y="181" text-anchor="middle" font-size="13" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">ファイルをメールで送付</text>
  <line x1="190" y1="196" x2="190" y2="211" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 left -->
  <rect x="40" y="211" width="300" height="38" rx="5" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="190" y="234" text-anchor="middle" font-size="13" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">バージョンを手動管理</text>
  <line x1="190" y1="249" x2="190" y2="264" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 left -->
  <rect x="40" y="264" width="300" height="38" rx="5" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="190" y="287" text-anchor="middle" font-size="13" fill="#1a3a5c" font-family="Hiragino Sans, Meiryo, sans-serif">相手の環境依存</text>

  <!-- Divider -->
  <line x1="380" y1="50" x2="380" y2="320" stroke="#d8d3cc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right column steps -->
  <!-- Step 1 right -->
  <rect x="420" y="105" width="300" height="38" rx="5" fill="#fdf0e8" stroke="#e07b39" stroke-width="1.5"/>
  <text x="570" y="128" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">内容を自然言語で指示</text>
  <line x1="570" y1="143" x2="570" y2="158" stroke="#e07b39" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <!-- Step 2 right -->
  <rect x="420" y="158" width="300" height="38" rx="5" fill="#fdf0e8" stroke="#e07b39" stroke-width="1.5"/>
  <text x="570" y="181" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">URLを発行してアクセス</text>
  <line x1="570" y1="196" x2="570" y2="211" stroke="#e07b39" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <!-- Step 3 right -->
  <rect x="420" y="211" width="300" height="38" rx="5" fill="#fdf0e8" stroke="#e07b39" stroke-width="1.5"/>
  <text x="570" y="234" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">更新すれば自動的に最新</text>
  <line x1="570" y1="249" x2="570" y2="264" stroke="#e07b39" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <!-- Step 4 right -->
  <rect x="420" y="264" width="300" height="38" rx="5" fill="#fdf0e8" stroke="#e07b39" stroke-width="1.5"/>
  <text x="570" y="287" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="Hiragino Sans, Meiryo, sans-serif">どのデバイスでも表示</text>

  <!-- Caption -->
  <text x="380" y="328" text-anchor="middle" font-size="11" fill="#888888" font-family="Hiragino Sans, Meiryo, sans-serif">図1-1　従来のOfficeフローと生成AI+HTMLフローの比較</text>
</svg>
