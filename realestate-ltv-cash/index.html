<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不動産投資のメリットとLTV活用</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
      /* テーマ（オレンジ×パープル）に合わせた背景 */
      background: linear-gradient(160deg, #3a1c4a 0%, #5a2a52 55%, #b0603e 100%);
      color: #ffead6;
    }
    h1 {
      font-size: clamp(18px, 4.5vw, 28px);
      font-weight: 700;
      text-align: center;
      letter-spacing: .02em;
    }
    .player {
      width: min(420px, 92vw);
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
      border: 3px solid rgba(245, 196, 110, .85);
      background: #000;
    }
    video { width: 100%; height: 100%; display: block; }
    p.note { font-size: 13px; opacity: .75; text-align: center; }
  </style>
</head>
<body>
  <h1>不動産投資のメリットとLTV活用</h1>
  <div class="player">
    <video src="realestate-ltv-cash.mp4" controls playsinline preload="metadata"></video>
  </div>
  <p class="note">教育用途の解説動画です。実行前は必ず専門家にご確認ください。</p>
</body>
</html>
